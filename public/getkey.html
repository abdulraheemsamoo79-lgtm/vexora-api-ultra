<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Free API Key — VEXORA API</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0b10; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #14141d; border: 1px solid #2a2a3a; border-radius: 16px; padding: 32px 28px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .logo { text-align: center; margin-bottom: 8px; }
    .logo img { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #c8102e; }
    h1 { text-align: center; font-size: 24px; margin: 10px 0 4px; }
    h1 span { color: #ff2d4d; }
    .sub { text-align: center; color: #9a9ab0; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #bdbdd0; margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #33334a; background: #0e0e15; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #c8102e; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px; background: linear-gradient(135deg, #c8102e, #ff2d4d); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; word-break: break-all; }
    .msg.err { display: block; background: #2a0f16; border: 1px solid #7a1230; color: #ff8296; }
    .msg.ok { display: block; background: #0f2417; border: 1px solid #14532d; color: #7ee2a0; }
    .keybox { margin-top: 14px; display: none; }
    .keybox .k { background: #0e0e15; border: 1px dashed #c8102e; border-radius: 10px; padding: 14px; font-family: monospace; font-size: 16px; text-align: center; color: #ffd166; word-break: break-all; }
    .keybox p { font-size: 13px; color: #9a9ab0; margin-top: 10px; line-height: 1.5; }
    .keybox code { color: #7ee2a0; word-break: break-all; }
    .foot { text-align: center; margin-top: 22px; font-size: 13px; color: #77778c; }
    .foot a { color: #ff2d4d; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
    <div class="logo"><img src="https://i.ibb.co/HTS7V92c/vexora-v2-3-samurai.png" alt="VEXORA"></div>
    <h1>VEXORA <span>API</span></h1>
    <p class="sub">Get your <b>free</b> API key — 100 requests/day, access to all 31 endpoints.</p>

    <form id="regForm">
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="e.g. Ahmed Khan" required minlength="2" maxlength="60">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required maxlength="120">
        <button id="btn" type="submit">Generate My Free Key</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="keybox" id="keybox">
        <div class="k" id="keyText"></div>
        <p>⚠️ Save this key now — it is shown only once.<br>
        Use it like this:<br><code id="example"></code></p>
    </div>

    <p class="foot">Already have a key? <a href="/">Open the API dashboard</a> and paste it in the tester.</p>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const keybox = document.getElementById('keybox');
    btn.disabled = true; btn.textContent = 'Generating...';
    msg.className = 'msg'; keybox.style.display = 'none';
    try {
        const res = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            })
        });
        const data = await res.json();
        if (data.status && data.apikey) {
            document.getElementById('keyText').textContent = data.apikey;
            document.getElementById('example').textContent = location.origin + '/api/ytsearch?q=phonk&apikey=' + data.apikey;
            keybox.style.display = 'block';
            msg.className = 'msg ok'; msg.textContent = '✅ ' + data.message;
            try { localStorage.setItem('vx_apikey', data.apikey); } catch (_) {}
        } else {
            msg.className = 'msg err'; msg.textContent = '❌ ' + (data.message || 'Something went wrong.');
        }
    } catch (err) {
        msg.className = 'msg err'; msg.textContent = '❌ Network error: ' + err.message;
    }
    btn.disabled = false; btn.textContent = 'Generate My Free Key';
});
</script>
</body>
</html>
